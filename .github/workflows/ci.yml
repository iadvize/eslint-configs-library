name: Continuous integration

on:
  push:
    branches:
      - 'master'
  pull_request:
    types: [opened, synchronize]

jobs:
  ci:
    name: 'install, lint'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@a6747255bd19d7a757dbdda8c654a9f84db19839 # v2-beta

    - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
      with:
        node-version: '16'

    - name: Cache npm cache
      uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v1.2.1
      with:
        path: ~/.npm
        key: v1-npm-${{ github.ref }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          v1-npm-${{ github.ref }}-
          v1-npm-

    - name: List all packages
      id: all-packages
      run: |
        PACKAGES=$(ls -d packages/* | paste -sd "," -)
        echo "::set-output name=packages::$PACKAGES"

    - name: List pull packages
      id: packages
      uses: actions/github-script@83e4cfe60ad25a2d0637965c993eb54c325d6d8d # 0.4.0
      env:
        PACKAGES_PUSH: ${{ steps.all-packages.outputs.packages }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          if (context.eventName !== 'pull_request') {
            console.log(`::set-output name=packages::${process.env.PACKAGES_PUSH}`);
            return;
          }

          const { data: pullLabels } = await github.issues.listLabelsOnIssue({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            per_page: 100,
          });

          const labels = pullLabels.map(label => label.name);
          const packageLabels = labels.filter(name => name.includes('packages/'));

          if (packageLabels.length === 1) {
            console.log(`::set-output name=packages::${packageLabels[0]}`);
            return;
          }

          console.log(`::set-output name=packages::${process.env.PACKAGES_PUSH}`);

    - name: Install
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      env:
        PACKAGES: ${{ steps.packages.outputs.packages }}
      run: |
        for PACKAGE in ${PACKAGES//,/ }; do
          echo $PACKAGE
          (cd $PACKAGE; npm ci)
        done

    - name: Lint
      env:
        PACKAGES: ${{ steps.packages.outputs.packages }}
      run: |
        for PACKAGE in ${PACKAGES//,/ }; do
          echo $PACKAGE
          (cd $PACKAGE; npm run lint:js)
        done

